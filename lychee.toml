# Configuration for the lychee link checker used by
# .github/workflows/link-check.yml
#
# Full reference: https://lychee.cli.rs/usage/config-file/

# This list links to slower/rate-limit-prone sites (arxiv.org, nist.gov,
# cisa.gov PDFs, iso.org) alongside plain GitHub repos — give those a
# realistic amount of time and a few retries instead of flaking CI on a
# slow response.
timeout = 20
max_retries = 3
retry_wait_time = 5

# media.defense.gov (the NSA-hosted mirror of the joint CISA/NSA/FBI/NCSC
# secure-AI-development guidelines) 403s every request from this CI
# environment regardless of User-Agent - almost certainly a network/IP
# block on .mil infrastructure against cloud/CI IP ranges, not a dead
# link. Manually verified live and correct (fetched and read directly)
# on 2026-08-30. Excluded here rather than accepting 403 globally, so a
# genuine 403 anywhere else still fails the check.
exclude = [
    '^https://media\.defense\.gov/2023/Nov/27/2003346994/',
]

# Redirects are expected and fine (GitHub org/repo renames are exactly what
# this workflow exists to keep pace with going forward).
accept = [100, 200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308]
